services:
  mysql8-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: central_alertas_test
      MYSQL_USER: alertas_test
      MYSQL_PASSWORD: alertas_test
      MYSQL_ROOT_PASSWORD: root_test
    ports:
      - "13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_test"]
      interval: 2s
      timeout: 5s
      retries: 30
