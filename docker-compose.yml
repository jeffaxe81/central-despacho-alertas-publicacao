services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: central_alertas
      MYSQL_USER: alertas
      MYSQL_PASSWORD: alertas_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "mysql://alertas:alertas_local@mysql:3306/central_alertas"
      # Demais variáveis (JWT_SECRET, OAUTH_SERVER_URL, VITE_APP_ID etc.) têm
      # fallback vazio no código (server/_core/env.ts) e não são obrigatórias
      # para subir a aplicação — defina aqui se e quando forem necessárias.
    ports:
      - "3000:3000"

volumes:
  mysql_data:
